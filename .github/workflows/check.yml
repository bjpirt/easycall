name: Check and deploy

on:
  push:
  pull_request:
  # "Run workflow" button: checks, then redeploys if run on main.
  workflow_dispatch:

env:
  WRANGLER_SEND_METRICS: "false"

# The workflow's GitHub token can only read the repo (deploying uses the
# Cloudflare token, not this one).
permissions:
  contents: read

# Actions are pinned to commit SHAs (a tag like v7 can be moved to point at
# other code); Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Deploys main to Cloudflare once the checks pass. Runs on a fresh runner, so
  # it's always a clean production build (never the E2E test build).
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time; a newer push waits rather than racing an older one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
